[package]
name = "devcontainer"
version = "0.0.1"
edition = "2021"
description = "Native Rust foundation for devcontainer CLI"
license = "MIT"
repository = "https://github.com/jooh/devcontainer-rs"
readme = "../../README.md"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"
