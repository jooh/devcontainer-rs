[package]
name = "devcontainer"
version = "0.0.1"
edition = "2021"
description = "Native Rust foundation for devcontainer CLI"
license = "MIT"
repository = "https://github.com/jooh/devcontainer-rs"
readme = "../../README.md"
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"
