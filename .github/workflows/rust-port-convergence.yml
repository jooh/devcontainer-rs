name: rust-port-convergence

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-port:
    name: Rust Port Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Workflow lint
        run: make actionlint-check

      - name: Shell lint
        run: make shellcheck

      - name: Rust fmt
        run: make rust-fmt

      - name: Rust clippy
        run: make rust-clippy

      - name: Rust check
        run: make rust-check

      - name: Rust doc
        run: make rust-doc

      - name: Rust tests
        run: make rust-tests

      - name: Dependency policy
        run: make cargo-deny-check

      - name: Build release binary
        run: cargo build --release --manifest-path cmd/devcontainer/Cargo.toml

      - name: Standalone artifact smoke
        run: ./scripts/standalone/smoke.sh ./cmd/devcontainer/target/release/devcontainer

      - name: PyPI wheel smoke
        run: make pypi-wheel-smoke

      - name: Rust coverage
        run: cargo llvm-cov --manifest-path cmd/devcontainer/Cargo.toml --lcov --output-path cmd/devcontainer/target/coverage.lcov

      - name: Native-only startup contract
        run: node build/check-native-only.js

      - name: Command matrix drift check
        run: node build/generate-command-matrix.js --check

      - name: Schema drift check
        run: node build/check-spec-drift.js

      - name: Parity harness
        run: node build/check-parity-harness.js

      - name: No Node runtime bridge
        run: node build/check-no-node-runtime.js

  network-smoke:
    name: Outbound Network Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: GHCR network smoke tests
        run: cargo test --manifest-path cmd/devcontainer/Cargo.toml --test network_smoke -- --ignored

  real-engine-lifecycle-smoke:
    name: Real Engine Lifecycle Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: docker
            smoke_target: real-engine-lifecycle-smoke-docker
          - runner: podman
            smoke_target: real-engine-lifecycle-smoke-podman
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Podman Compose
        if: matrix.runner == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Runtime version
        run: |
          if [[ "${{ matrix.runner }}" == "podman" ]]; then
            podman version
            podman-compose version
          else
            docker version
            docker compose version
          fi

      - name: Real engine lifecycle smoke
        run: make ${{ matrix.smoke_target }}

  upstream-convergence:
    name: Upstream Convergence Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify pinned upstream compatibility baseline
        run: node build/check-upstream-compatibility.js
