name: rust-port-convergence

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-port:
    name: Rust Port Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Workflow lint
        run: make actionlint-check

      - name: Shell lint
        run: make shellcheck

      - name: Rust fmt
        run: make rust-fmt

      - name: Rust clippy
        run: make rust-clippy

      - name: Rust check
        run: make rust-check

      - name: Rust doc
        run: make rust-doc

      - name: Rust tests
        run: make rust-tests

      - name: Dependency policy
        run: make cargo-deny-check

      - name: Rust coverage
        run: make rust-coverage

      - name: Native-only startup contract
        run: node build/check-native-only.js

      - name: Command matrix drift check
        run: node build/generate-command-matrix.js --check

      - name: Schema drift check
        run: node build/check-spec-drift.js

      - name: Parity harness
        run: node build/check-parity-harness.js

      - name: No Node runtime bridge
        run: node build/check-no-node-runtime.js

  artifact-build:
    if: github.event_name == 'pull_request'
    name: Package Artifacts (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            pypi_wheel_builder: manylinux
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            pypi_wheel_builder: host
    runs-on: ${{ matrix.runner }}
    env:
      DIST_VERSION: 0.31.0
      DIST_ARTIFACT_DIR: target/distrib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup uv
        if: matrix.pypi_wheel_builder == 'host'
        uses: astral-sh/setup-uv@v6

      - name: Install cargo-dist
        shell: bash
        run: cargo install cargo-dist --locked --version "$DIST_VERSION"

      - name: Build cargo-dist archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' cmd/devcontainer/Cargo.toml | head -n 1)"
          ~/.cargo/bin/dist build \
            --artifacts=local \
            --target '${{ matrix.rust_target }}' \
            --tag "devcontainer-v${version}" \
            --allow-dirty

      - name: Build PyPI wheel (manylinux)
        if: matrix.pypi_wheel_builder == 'manylinux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.rust_target }}
          manylinux: 2014
          container: quay.io/pypa/manylinux2014_x86_64
          args: --release --out dist/wheels --compatibility pypi

      - name: Build PyPI wheel (host)
        if: matrix.pypi_wheel_builder == 'host'
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from maturin maturin build \
            --release \
            --target '${{ matrix.rust_target }}' \
            --out dist/wheels \
            --compatibility pypi

      - name: Upload artifact smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-${{ matrix.target }}
          path: |
            ${{ env.DIST_ARTIFACT_DIR }}/devcontainer-${{ matrix.rust_target }}.tar.gz
            ${{ env.DIST_ARTIFACT_DIR }}/devcontainer-${{ matrix.rust_target }}.tar.gz.sha256
            dist/wheels/*.whl
            scripts/standalone/archive-smoke.sh
            scripts/standalone/pypi-wheel-smoke.sh
            scripts/standalone/smoke.sh
          if-no-files-found: error

  artifact-smoke:
    if: github.event_name == 'pull_request'
    name: Isolated Package Smoke (${{ matrix.target }})
    needs: artifact-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Download artifact smoke bundle
        uses: actions/download-artifact@v4
        with:
          name: pr-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/devcontainer-artifact-smoke

      - name: Verify source checkout is absent
        shell: bash
        run: |
          set -euo pipefail
          for source_path in .git Cargo.toml cmd; do
            if [[ -e "$GITHUB_WORKSPACE/$source_path" ]]; then
              echo "isolated smoke workspace contains repository path: $source_path" >&2
              exit 1
            fi
          done

      - name: Smoke packaged archive and wheel
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/devcontainer-artifact-smoke"
          harness="$bundle/scripts/standalone"
          archive="$bundle/target/distrib/devcontainer-${{ matrix.rust_target }}.tar.gz"
          wheels=("$bundle"/dist/wheels/*.whl)

          if [[ ! -f "$archive" ]]; then
            echo "expected cargo-dist archive not found: $archive" >&2
            exit 1
          fi
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one wheel in $bundle/dist/wheels" >&2
            exit 1
          fi

          chmod +x "$harness"/*.sh
          "$harness/archive-smoke.sh" "$archive"
          "$harness/pypi-wheel-smoke.sh" "${wheels[0]}"

  network-smoke:
    name: Outbound Network Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: GHCR network smoke tests
        run: cargo test --manifest-path cmd/devcontainer/Cargo.toml --test network_smoke -- --ignored

  real-engine-lifecycle-smoke:
    name: Real Engine Lifecycle Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: docker
            smoke_target: real-engine-lifecycle-smoke-docker
          - runner: podman
            smoke_target: real-engine-lifecycle-smoke-podman
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Podman Compose
        if: matrix.runner == 'podman'
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y podman podman-compose

      - name: Runtime version
        run: |
          if [[ "${{ matrix.runner }}" == "podman" ]]; then
            podman version
            podman-compose version
          else
            docker version
            docker compose version
          fi

      - name: Real engine lifecycle smoke
        run: make ${{ matrix.smoke_target }}

  upstream-convergence:
    name: Upstream Convergence Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify pinned upstream compatibility baseline
        run: node build/check-upstream-compatibility.js
