name: devcontainer-release

on:
  push:
    branches:
      - main

concurrency:
  group: devcontainer-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TAG_PREFIX: devcontainer-v
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            base_version="0.0.0"
          else
            base_version="${latest_tag#"$TAG_PREFIX"}"
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          next_version="${major}.${minor}.$((patch + 1))"
          next_tag="${TAG_PREFIX}${next_version}"

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            pypi_wheel_builder: manylinux
            pypi_compatibility: pypi
            pypi_manylinux_container: quay.io/pypa/manylinux2014_x86_64
          - target: linux-x64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            pypi_wheel_builder: host
            pypi_compatibility: musllinux_1_2
            pypi_manylinux_container: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            pypi_wheel_builder: manylinux
            pypi_compatibility: pypi
            pypi_manylinux_container: quay.io/pypa/manylinux2014_aarch64
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            pypi_wheel_builder: host
            pypi_compatibility: musllinux_1_2
            pypi_manylinux_container: ''
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            pypi_wheel_builder: host
            pypi_compatibility: pypi
            pypi_manylinux_container: ''
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            pypi_wheel_builder: host
            pypi_compatibility: pypi
            pypi_manylinux_container: ''
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TOML_PATH: cmd/devcontainer/Cargo.toml
      DIST_VERSION: 0.31.0
      DIST_ARTIFACT_DIR: target/distrib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install musl linker
        if: endsWith(matrix.rust_target, '-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --locked --version "$DIST_VERSION"

      - name: Set Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          perl -0pi -e 's/^version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$version"'"/m' "$CARGO_TOML_PATH"

      - name: Build dist artifacts
        shell: bash
        run: |
          set -euo pipefail
          ~/.cargo/bin/dist build \
            --artifacts=local \
            --target '${{ matrix.rust_target }}' \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --allow-dirty

      - name: Build PyPI wheel (manylinux)
        if: matrix.pypi_wheel_builder == 'manylinux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.rust_target }}
          manylinux: 2014
          container: ${{ matrix.pypi_manylinux_container }}
          args: --release --out dist/wheels --compatibility ${{ matrix.pypi_compatibility }}

      - name: Setup uv
        if: matrix.pypi_wheel_builder == 'host'
        uses: astral-sh/setup-uv@v6

      - name: Build PyPI wheel (host)
        if: matrix.pypi_wheel_builder == 'host'
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from maturin maturin build \
            --release \
            --target '${{ matrix.rust_target }}' \
            --out dist/wheels \
            --compatibility '${{ matrix.pypi_compatibility }}'

      - name: Upload release smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.target }}
          path: |
            ${{ env.DIST_ARTIFACT_DIR }}/devcontainer-${{ matrix.rust_target }}.tar.gz
            ${{ env.DIST_ARTIFACT_DIR }}/devcontainer-${{ matrix.rust_target }}.tar.gz.sha256
            dist/wheels/*.whl
            scripts/standalone/archive-smoke.sh
            scripts/standalone/pypi-wheel-smoke.sh
            scripts/standalone/smoke.sh
          if-no-files-found: error

  artifact-smoke:
    needs: [prepare, build]
    name: Isolated Release Smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Download release smoke bundle
        uses: actions/download-artifact@v4
        with:
          name: release-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/devcontainer-artifact-smoke

      - name: Verify source checkout is absent
        shell: bash
        run: |
          set -euo pipefail
          for source_path in .git Cargo.toml cmd; do
            if [[ -e "$GITHUB_WORKSPACE/$source_path" ]]; then
              echo "isolated smoke workspace contains repository path: $source_path" >&2
              exit 1
            fi
          done

      - name: Smoke packaged archive and wheel
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/devcontainer-artifact-smoke"
          harness="$bundle/scripts/standalone"
          archive="$bundle/target/distrib/devcontainer-${{ matrix.rust_target }}.tar.gz"
          wheels=("$bundle"/dist/wheels/*.whl)

          if [[ ! -f "$archive" ]]; then
            echo "expected cargo-dist archive not found: $archive" >&2
            exit 1
          fi
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one wheel in $bundle/dist/wheels" >&2
            exit 1
          fi

          chmod +x "$harness"/*.sh
          "$harness/archive-smoke.sh" "$archive"
          "$harness/pypi-wheel-smoke.sh" "${wheels[0]}"

  artifact-smoke-musl:
    needs: [prepare, build]
    name: Isolated Release Smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download release smoke bundle
        uses: actions/download-artifact@v4
        with:
          name: release-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/devcontainer-artifact-smoke

      - name: Verify source checkout is absent
        shell: bash
        run: |
          set -euo pipefail
          for source_path in .git Cargo.toml cmd; do
            if [[ -e "$GITHUB_WORKSPACE/$source_path" ]]; then
              echo "isolated smoke workspace contains repository path: $source_path" >&2
              exit 1
            fi
          done

      - name: Smoke packaged archive and wheel in Alpine
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/devcontainer-artifact-smoke"
          harness="$bundle/scripts/standalone"
          archive="$bundle/target/distrib/devcontainer-${{ matrix.rust_target }}.tar.gz"
          wheels=("$bundle"/dist/wheels/*.whl)

          if [[ ! -f "$archive" ]]; then
            echo "expected cargo-dist archive not found: $archive" >&2
            exit 1
          fi
          if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one wheel in $bundle/dist/wheels" >&2
            exit 1
          fi

          chmod +x "$harness"/*.sh
          docker run --rm \
            --volume "$bundle:/bundle:ro" \
            ghcr.io/astral-sh/uv:python3.12-alpine \
            sh -c 'apk add --no-cache bash >/dev/null && \
              /bin/bash /bundle/scripts/standalone/archive-smoke.sh \
                /bundle/target/distrib/devcontainer-${{ matrix.rust_target }}.tar.gz && \
              wheel=$(find /bundle/dist/wheels -type f -name "*.whl" -print -quit) && \
              /bin/bash /bundle/scripts/standalone/pypi-wheel-smoke.sh "$wheel"'

  release:
    needs: [prepare, build, artifact-smoke, artifact-smoke-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-smoke-*

      - name: Check release artifact names
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -n "${seen[$name]:-}" ]]; then
              printf 'duplicate release artifact basename: %s\n  %s\n  %s\n' "$name" "${seen[$name]}" "$file" >&2
              exit 1
            fi
            seen["$name"]="$file"

            if [[ "$name" == *.whl ]]; then
              unzip -t "$file" >/dev/null
            fi
          done < <(
            find artifacts -type f \
              \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.whl' \) \
              -print0
          )

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          tag='${{ needs.prepare.outputs.tag }}'
          mapfile -t release_files < <(
            find artifacts -type f \
              \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.whl' \) \
              | sort
          )

          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "no release artifacts found" >&2
            exit 1
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --fail-on-no-commits \
            --title "devcontainer v${version}" \
            --notes "Automated release for devcontainer v${version}." \
            "${release_files[@]}"

  pypi:
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-smoke-*

      - name: Collect PyPI wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          mapfile -t wheels < <(find dist -type f -name '*.whl' | sort)

          if [[ "${#wheels[@]}" -eq 0 ]]; then
            echo "no PyPI wheels found" >&2
            exit 1
          fi

          declare -A wheel_names=()
          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"
            if [[ -n "${wheel_names[$name]:-}" ]]; then
              printf 'duplicate PyPI wheel basename: %s\n  %s\n  %s\n' "$name" "${wheel_names[$name]}" "$wheel" >&2
              exit 1
            fi
            wheel_names["$name"]="$wheel"
            unzip -t "$wheel" >/dev/null
          done

          cp "${wheels[@]}" pypi-dist/

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          skip-existing: true

  npm:
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify trusted publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node - <<'EOF'
          const { execFileSync } = require("node:child_process");

          function parse(version) {
            return version.trim().replace(/^v/, "").split(".").map(Number);
          }

          function isAtLeast(actual, minimum) {
            const width = Math.max(actual.length, minimum.length);
            for (let index = 0; index < width; index += 1) {
              const actualPart = actual[index] ?? 0;
              const minimumPart = minimum[index] ?? 0;
              if (actualPart > minimumPart) {
                return true;
              }
              if (actualPart < minimumPart) {
                return false;
              }
            }
            return true;
          }

          const minimumNodeVersion = [22, 14, 0];
          const minimumNpmVersion = [11, 5, 1];
          const nodeVersion = process.versions.node;
          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();

          if (!isAtLeast(parse(nodeVersion), minimumNodeVersion)) {
            throw new Error(`trusted publishing requires Node >= ${minimumNodeVersion.join(".")}; found ${nodeVersion}`);
          }

          if (!isAtLeast(parse(npmVersion), minimumNpmVersion)) {
            throw new Error(`trusted publishing requires npm >= ${minimumNpmVersion.join(".")}; found ${npmVersion}`);
          }
          EOF

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-smoke-*

      - name: Prepare npm packages
        shell: bash
        run: |
          set -euo pipefail
          node build/prepare-npm-packages.js \
            --version '${{ needs.prepare.outputs.version }}' \
            --artifacts-dir artifacts \
            --output-dir dist/npm

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          node build/publish-npm-packages.js --skip-unregistered \
            dist/npm/devcontainer-rs-devcontainer-darwin-x64 \
            dist/npm/devcontainer-rs-devcontainer-darwin-arm64 \
            dist/npm/devcontainer-rs-devcontainer-linux-x64-gnu \
            dist/npm/devcontainer-rs-devcontainer-linux-x64-musl \
            dist/npm/devcontainer-rs-devcontainer-linux-arm64-gnu \
            dist/npm/devcontainer-rs-devcontainer-linux-arm64-musl \
            dist/npm/devcontainer-rs \
            dist/npm/devcontainer-rs-cli
