name: devcontainer-release

on:
  push:
    branches:
      - main

concurrency:
  group: devcontainer-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TAG_PREFIX: devcontainer-v
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            base_version="0.0.0"
          else
            base_version="${latest_tag#${TAG_PREFIX}}"
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          next_version="${major}.${minor}.$((patch + 1))"
          next_tag="${TAG_PREFIX}${next_version}"

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive_name: devcontainer-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
            checksum_cmd: sha256sum
            pypi_wheel_builder: manylinux
          - target: linux-x64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            archive_name: devcontainer-${{ needs.prepare.outputs.version }}-linux-x64-musl.tar.gz
            checksum_cmd: sha256sum
            pypi_wheel_builder: host
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            archive_name: devcontainer-${{ needs.prepare.outputs.version }}-darwin-x64.tar.gz
            checksum_cmd: shasum -a 256
            pypi_wheel_builder: host
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            archive_name: devcontainer-${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz
            checksum_cmd: shasum -a 256
            pypi_wheel_builder: host
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TOML_PATH: cmd/devcontainer/Cargo.toml
      CRATE_DIR: cmd/devcontainer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install musl linker
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Set Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          perl -0pi -e 's/^version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$version"'"/m' "$CARGO_TOML_PATH"

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target '${{ matrix.rust_target }}' --manifest-path "$CARGO_TOML_PATH"

      - name: Standalone smoke
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/standalone/smoke.sh "$CRATE_DIR/target/${{ matrix.rust_target }}/release/devcontainer"

      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_name='${{ matrix.archive_name }}'
          tar -C "$CRATE_DIR/target/${{ matrix.rust_target }}/release" -czf "$artifact_name" devcontainer
          ${{ matrix.checksum_cmd }} "$artifact_name" > "${artifact_name}.sha256"

      - name: Build PyPI wheel (manylinux)
        if: matrix.pypi_wheel_builder == 'manylinux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.rust_target }}
          manylinux: 2014
          args: --release --out dist/wheels --compatibility pypi

      - name: Setup uv
        if: matrix.pypi_wheel_builder == 'host'
        uses: astral-sh/setup-uv@v6

      - name: Build PyPI wheel (host)
        if: matrix.pypi_wheel_builder == 'host'
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from maturin maturin build \
            --release \
            --target '${{ matrix.rust_target }}' \
            --out dist/wheels \
            --compatibility pypi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
            dist/wheels/*.whl

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          tag='${{ needs.prepare.outputs.tag }}'
          mapfile -t release_files < <(find artifacts -type f | sort)

          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "no release artifacts found" >&2
            exit 1
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --fail-on-no-commits \
            --title "devcontainer v${version}" \
            --notes "Automated release for devcontainer v${version}." \
            "${release_files[@]}"

  pypi:
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish wheels to PyPI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -type f -name '*.whl' | sort)

          if [[ "${#wheels[@]}" -eq 0 ]]; then
            echo "no PyPI wheels found" >&2
            exit 1
          fi

          uv publish "${wheels[@]}"
